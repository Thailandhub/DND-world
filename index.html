
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>⚔️ D&D World</h1>
  <p>โลกแห่งการผจญภัย</p>
</header>

<nav>
  <button onclick="showPage('home')">หน้าหลัก</button>
  <button onclick="showPage('character')">ตัวละคร</button>
  <button onclick="showPage('map')">แผนที่</button>
  <button onclick="showPage('dice')">ลูกเต๋า</button>
</nav>

<main>

<section id="home" class="page">
  <h2>ยินดีต้อนรับสู่ D&D World</h2>
  <p>สร้างตัวละครและเริ่มการผจญภัยของคุณ</p>
  <button onclick="showPage('character')">
    + สร้างตัวละคร
  </button>
  <h3>ตัวละครของฉัน</h3>
  <div id="characterList"></div>
</section>

<section id="character" class="page hidden">
  <h2>สร้างตัวละคร</h2>

  <label>ชื่อตัวละคร</label>
  <input id="name" placeholder="ชื่อตัวละคร">

  <label>เผ่า</label>
  <select id="race">
    <option>มนุษย์</option>
    <option>เอลฟ์</option>
    <option>คนแคระ</option>
    <option>ฮาล์ฟลิง</option>
    <option>ดราก้อนบอร์น</option>
  </select>

  <label>อาชีพ</label>
  <select id="job">
    <option>นักรบ</option>
    <option>นักเวท</option>
    <option>นักธนู</option>
    <option>นักบวช</option>
    <option>โจร</option>
    <option>พาลาดิน</option>
  </select>

  <h3>ค่าสถานะ</h3>
  <div id="stats"></div>

  <button onclick="createCharacter()">บันทึกตัวละคร</button>
</section>

<section id="map" class="page hidden">
  <h2>แผนที่ 2D</h2>
  <p>แตะช่องเพื่อวางตัวละคร</p>
  <div id="mapGrid"></div>
</section>

<section id="dice" class="page hidden">
  <h2>ทอยลูกเต๋า</h2>
  <select id="diceType">
    <option value="4">D4</option>
    <option value="6">D6</option>
    <option value="8">D8</option>
    <option value="10">D10</option>
    <option value="12">D12</option>
    <option value="20" selected>D20</option>
  </select>
  <button onclick="rollDice()">ทอยลูกเต๋า</button>
  <h1 id="diceResult">?</h1>
</section>

</main>

<script src="script.js"></script>
</body>
</html>
